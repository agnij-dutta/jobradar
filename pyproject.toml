[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "0.1.0"
description = "Search company job boards straight from Greenhouse, Ashby and Lever, with filters that don't lie."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools]
packages = ["jobradar"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "RUF001",  # ambiguous unicode: the gazetteer and dash normalizer intentionally contain en dashes and accented names
  "RUF002",
  "RUF003",
  "E501",    # long regex alternations read better unbroken; ruff format handles code line length
]

[tool.mypy]
python_version = "3.10"
files = ["jobradar"]
ignore_missing_imports = true
check_untyped_defs = true
